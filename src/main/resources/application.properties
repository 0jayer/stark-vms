spring.application.name=vms-backend

# Database Configuration (environment-based)
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# JPA Settings
# ddl-auto=update is for local development only
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# CORS Configuration
# Comma-separated allowed origins; defaults to localhost and 127.0.0.1 on any port for Flutter web
app.cors.allowed-origins=http://localhost:*,http://127.0.0.1:*

# JWT / Authentication (values come from environment variables, never committed)
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-minutes=60
app.admin.username=${ADMIN_USERNAME}
app.admin.password=${ADMIN_PASSWORD}